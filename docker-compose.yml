services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: triad_dms
      SECRET_KEY: change-me-in-production-secret-key-32b
      JWT_SECRET: change-me-in-production-jwt-secret-32b
      REQUIRE_AUTH_FOR_UPLOAD: "false"
      OCR_ENABLED: "true"
      SEED_DEFAULTS: "true"
      ADMIN_EMAILS: admin@triad.ai
    depends_on:
      mongo:
        condition: service_healthy
    # Seed the demo accounts, then serve through gunicorn.
    command: sh -c "python -m app.seed && gunicorn --workers 2 --bind 0.0.0.0:5000 run:app"

volumes:
  mongo_data:
